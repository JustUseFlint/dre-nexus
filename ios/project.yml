name: DRENexus
options:
  bundleIdPrefix: com.justuseflint
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DRENexus:
    type: application
    platform: iOS
    sources:
      - path: DRENexus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justuseflint.drenexus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DRE Nexus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: "DRE Nexus uses the camera to photograph evidence and scan driver license and VIN barcodes."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "DRE Nexus uses the microphone for voice-to-text notes."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "DRE Nexus converts your dictated notes to text on device."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "DRE Nexus uses Face ID to lock case data."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach existing photos or videos to a case."
    entitlements:
      path: DRENexus/DRENexus.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
